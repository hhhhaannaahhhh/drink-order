<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Coffee Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>What drink would you like?</h1>
<button id="staff">Staff</button>
<div id="staffView" style="display: none"></div>
<form>
    <p id="whatsYourName"> What's your name?</p>
    <input type="text" id="userName" placeholder="Hannah">
</form>
<canvas id="orderBox" width="500" height="300"></canvas>
<div id = "orderSum">
    <h3> Your order:</h3>
</div>
<button id="submitOrder" type="button">Submit Order</button>
<script>
    //constants for the canvas
    const canvas = document.getElementById("orderBox");
    const ctx = canvas.getContext("2d");
    //list of drinks
    const drinks = [
        {name: "Coffee", imageSrc: "assets/coffee.png", x: 20, y: 30},
        {name: "Latte", imageSrc: "assets/latte.png", x: 140, y: 30},
        {name: "Tea", imageSrc: "assets/tea.png", x: 260, y: 30},
        {name: "Smoothie", imageSrc: "assets/smoothie.png", x: 380, y: 30}
    ];
    //hold the images
    const images = {};
    let imageLoaded = 0;
//function for the drinks names underneath the images
    function drinkImg(){
        drinks.forEach(function(drink){
            const img = images[drink.name];
            if (img.complete) {
                ctx.drawImage(img, drink.x, drink.y, 80, 80);
                ctx.font = "12px Verdana";
                ctx.fillStyle = "black";
                ctx.textAlign = "center";
                ctx.fillText(drink.name, drink.x + 30, drink.y + 100);
            }
        });
    }
    // this draws the images onto the canvas
    drinks.forEach(function(drink) {
        const img = new Image();
        img.src = drink.imageSrc;
        images[drink.name] = img;
        img.onload = function(){
            imageLoaded++;
            if (imageLoaded === drinks.length){
                drinkImg();
            }
        }
    });

    //write out the order below the canvas for good user interaction
    const orderList = {
        name: "",
        drink: null,
        milk: null,
        extras: []
    };
    const orderSum = document.getElementById("orderSum");
    orderSum.id = "orderSum";
    function addOrderSum(){
        orderList.name = document.getElementById("userName").value;

        let html = `<h3> Your order: </h3> <ul>`;
        if (orderList.name) html += `<li> <strong>Name:</strong> ${orderList.name}</li>`;
        if (orderList.drink) html += `<li><strong>Drink:</strong> ${orderList.drink}</li>`;
        if (orderList.milk) html += `<li><strong>Milk:</strong> ${orderList.milk}</li>`;
        if (orderList.extras.length > 0) {
            orderList.extras.forEach(function (extra){
                html += `<li><strong>Extras:</strong> ${extra}</li>`;
            });
        }
        html += `</ul>`;
        orderSum.innerHTML = html;

    }

    // milk options write similar to drinks
    const milks = [
        {name: "Whole", imageSrc : "assets/milk.png", x: 20, y: 30},
        {name: "Oat", imageSrc: "assets/oatmilk.png", x: 140, y: 30},
        {name: "Almond", imageSrc: "assets/almond.png", x: 260, y: 30}
    ];
    function milkExtras(){
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        milks.forEach(function (milk){
            const milkImg = images[milk.name];
            if (milkImg.complete){
                ctx.drawImage(milkImg, milk.x, milk.y, 80, 80);
                ctx.font = "12px Verdana";
                ctx.fillStyle = "black";
                ctx.textAlign = "center";
                ctx.fillText(milk.name, milk.x + 30, milk.y + 100);
            }
        });
    }
    milks.forEach(function (milk){
        const milkImg = new Image();
        milkImg.src = milk.imageSrc;
        images[milk.name] = milkImg;
        milkImg.onload = function(){
            imageLoaded++;
            if (imageLoaded === milks.length){
                milkImg();
            }
        }
    });

    // extras same to milk and drinks dont have images yet so commented out
    const extras = [
        {name: "Hot", imageSrc: "assets/hot.png", x : 20, y: 30},
        {name : "Iced", imageSrc: "assets/iced.png", x: 120, y: 30},
        {name: "Caramel", imageSrc: "assets/caramel.png", x: 220, y: 30},
        {name: "Mocha", imageSrc: "assets/mocha.png", x: 320, y: 30},
        {name: "Vanilla", imageSrc: "assets/vanilla.png", x: 420, y: 30}
    ];
    function drinkExtra(){
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        extras.forEach(function (extra){
            const extraImg = images[extra.name]
            if (extraImg.complete){
                ctx.drawImage(extraImg, extra.x, extra.y, 80, 80);
                ctx.font = "12px Verdana";
                ctx.fillStyle = "black";
                ctx.textAlign = "center";
                ctx.fillText(extra.name, extra.x + 30, extra.y + 100);
            }
        });
    }
    extras.forEach(function (extra){
        const extraImg = new Image();
        extraImg.src = extra.imageSrc;
        images[extra.name] = extraImg;
        extraImg.onload = function(){
            imageLoaded++;
            if (imageLoaded === extras.length) {
                extraImg();
            }
        }
    });

    // different extras for smoothie
    const smoothies = [
        {name: "Banana", imageSrc: "assets/banana.png", x: 20, y: 30},
        {name: "Cherry", imageSrc: "assets/cherry.png", x: 140, y: 30},
        {name: "Strawberry", imageSrc: "assets/strawberry.png", x: 260, y: 30}
    ];

    function smoothieExtras() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        smoothies.forEach(function (smoothie) {
            const smoothieExtraImg = images[smoothie.name];
            if (smoothieExtraImg.complete) {
                ctx.drawImage(smoothieExtraImg, smoothie.x, smoothie.y, 80, 80);
                ctx.font = "12px Verdana";
                ctx.fillStyle = "black";
                ctx.textAlign = "center";
                ctx.fillText(smoothie.name, smoothie.x + 30, smoothie.y + 100);
            }
        });
    }
    smoothies.forEach(function (smoothie){
        const smoothieExtraImg = new Image();
        smoothieExtraImg.src = smoothie.imageSrc;
        images[smoothie.name] = smoothieExtraImg;
        smoothieExtraImg.onload = function(){
            imageLoaded++;
            if (imageLoaded === smoothieExtras.length){
                smoothieExtraImg();
            }
        }
    });



    // track which images are up on the screen to stop clicks overlapping
    let currentScreen = "drinks"
    //event to make the drinks clickable
    canvas.addEventListener("click", function (event) {
        const rect = canvas.getBoundingClientRect(); //figure out canvas location
        const clickX = event.clientX - rect.left;
        const clickY = event.clientY - rect.top;
        if (currentScreen == "drinks") {
        drinks.forEach(function (drink) {
            if (
                clickX >= drink.x && clickX <= drink.x + 80 &&
                clickY >= drink.y && clickY <= drink.y + 80
            ) {
                orderList.drink = drink.name;
                addOrderSum();
                currentScreen = "milks"
                milkExtras();
            }
        });
    } else if (currentScreen == "milks") {
            milks.forEach(function (milk){
                if (
                    clickX >= milk.x && clickX <= milk.x + 80 &&
                    clickY >= milk.y && clickY <= milk.y + 80
                ){
                    orderList.milk = milk.name;
                    addOrderSum();
                    if (orderList.drink === "Smoothie" ){
                        smoothieExtras();
                        currentScreen = "smoothie"
                    } else {
                        drinkExtra();
                        currentScreen = "extras"
                    }


                }
            });
        }  else if (currentScreen == "extras") {
            extras.forEach(function (extra) {
                if (
                    clickX >= extra.x && clickX <= extra.x + 80 &&
                    clickY >= extra.y && clickY <= extra.y + 80
                ) {
                    orderList.extras.push(extra.name);
                    addOrderSum();
                }
            });
        } else if (currentScreen == "smoothie"){
            smoothies.forEach(function (smoothieExtra){
                if (
                    clickX >= smoothieExtra.x && clickX <= smoothieExtra.x + 80 &&
                    clickY >= smoothieExtra.y && clickY <= smoothieExtra.y + 80
                ){
                    orderList.extras.push(smoothieExtra.name);
                    addOrderSum();
                }
            })
        }

        });
    // submit order and send to databse
    const submitOrder = document.getElementById("submitOrder");
    submitOrder.addEventListener("click",submitOrderButton);
    // send order to php to add to database
    function submitOrderButton(){
        addOrderSum();
        fetch("submit_order.php",{
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(orderList)
        }).then(res => res.json()).then(data => {
            if (data.status === 'good'){
                alert("Thank you for your order!");
            } else {
                alert("Theres been an issue with your order");
            }
        })
    }

    //staff view
    const staffButton = document.getElementById("staff");
    const staffView = document.getElementById("staffView");
    const orderCanvas = document.getElementById("orderBox");
    const orderSummary = document.getElementById("orderSum");
    const customerName = document.getElementById("userName");
    const nameText = document.getElementById("whatsYourName");
    // hides other things on the screen to show the staff view
    staffButton.addEventListener("click", function (){
        orderCanvas.style.display = "none";
        submitOrder.style.display = "none";
        orderSummary.style.display = "none";
        customerName.style.display = "none";
        nameText.style.display = "none";
        staffView.style.display = "block";
        showOrders();
    });
    // GET data from the submit orders
    function showOrders(){
       fetch('submit_order.php').then(function (result){
           return result.json();
       }).then (function (orders){
           if (orders.length == 0){
               staffView.innerHTML= `<p> No orders to show </p>`
               return;
           }
       })
        // write data as a list on the screen
        let orderList = `<h3> All Orders: </h3> <ul>`;
       for (let index = 0; index < orders.length; index++){
           orderList += `<li id= "order` + order.order_number + `">` +
               'Order ' + order.order_number + ':' + order.customer_name + ',' +
               order.customer_drink + ',' + order.drink_milk + ',' + order.drink_extras
               + "<button onclick = 'finishOrder(" + order.order_number+")'> Finish Order </button>" +
               "</li>";

       }
        orderList += "</ul>";
       staffView.innerHTML = orderList;
    }
    function completeOrders(orderNumber){
        fetch("submit_order.php",{
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({action: "complete", order_number: orderNumber})
        })
            .then (function (result){
                return result.json();
            }) .then (function (response){
                if (response.status == "completed"){
                    let list = document.getElementById("order" + orderNumber);
                    if (list) list.parentNode.removeChild(list);
                }
        });

    }




</script>
</body>
</html>
